# Dev uses SQLite (prisma/dev.db) – no docker needed for quick start.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mislms
      POSTGRES_USER: mis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mis123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mis"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
